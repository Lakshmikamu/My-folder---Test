<!DOCTYPE html>
<html>
<head>
    <title>Plant Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="card shadow">
        <div class="card-header">
            <h3 class="mb-0">Plant Explorer</h3>
        </div>

        <div class="card-body">

            <!-- EPC -->
            <label class="form-label">EPC</label>
            <select id="epc" class="form-select">
                <option value="">Select EPC</option>
            </select>

            <br>

            <!-- Plant -->
            <label class="form-label">Plant</label>
            <select id="plant" class="form-select">
                <option value="">Select Plant</option>
            </select>

            <br>

            <!-- Logger -->
            <label class="form-label">Logger</label>
            <select id="logger" class="form-select">
                <option value="">Select Logger</option>
            </select>

            <br>

            <!-- Device -->
            <label class="form-label">Device</label>
            <select id="device" class="form-select">
                <option value="">Select Device</option>
            </select>

            <br>

            <!-- Field -->
            <label class="form-label">Field</label>
            <select id="field" class="form-select">
                <option value="">Select Field</option>
            </select>

            <br>

            <button id="getValue" class="btn btn-primary">
                Get Value
            </button>

            <div id="result" class="mt-4"></div>
            <hr class="my-4">

<h4>Data Correction</h4>

<div class="row">

    <div class="col-md-4 mb-3">
        <label class="form-label">Timestamp</label>
        <input type="datetime-local"
               id="correction_time"
               class="form-control">
    </div>

    <div class="col-md-4 mb-3">
        <label class="form-label">Value</label>
        <input type="number"
               id="correction_value"
               class="form-control">
    </div>

    <div class="col-md-4 mb-3">
        <label class="form-label">Reason</label>
        <input type="text"
               id="reason"
               class="form-control"
               placeholder="Enter reason">
    </div>

</div>

<button id="writeValue" class="btn btn-success">
    Write To InfluxDB
</button>

<div id="writeResult" class="mt-3"></div>

        </div>
    </div>

</div>

<!-- All your existing JavaScript scripts go here -->

</body>
</html>

<script>

fetch('get_epcs.php')
    .then(response => response.json())
    .then(data => {

        let epcDropdown = document.getElementById('epc');

        data.forEach(epc => {

            let option = document.createElement('option');

            option.value = epc;
            option.text = epc;

            epcDropdown.appendChild(option);

        });

    });

</script>
<script>

document.getElementById('epc').addEventListener('change', function() {

    let epc = this.value;

    let plantDropdown = document.getElementById('plant');

    plantDropdown.innerHTML =
        '<option value="">Select Plant</option>';

    fetch('get_plants.php?epc_name=' + encodeURIComponent(epc))
        .then(response => response.json())
        .then(data => {

            data.forEach(plant => {

                let option = document.createElement('option');

                option.value = plant;
                option.text = plant;

                plantDropdown.appendChild(option);

            });

        });

});

</script>
<script>

document.getElementById('plant').addEventListener('change', function() {

    let plant = this.value;

    let loggerDropdown = document.getElementById('logger');

    loggerDropdown.innerHTML =
        '<option value="">Select Logger</option>';

    fetch('get_loggers.php?plant_name=' + encodeURIComponent(plant))
        .then(response => response.json())
        .then(data => {

            data.forEach(logger => {

                let option = document.createElement('option');

                option.value = logger;
                option.text = logger;

                loggerDropdown.appendChild(option);

            });

        });

});

</script>
<script>

document.getElementById('logger').addEventListener('change', function() {

    let epc = document.getElementById('epc').value;
    let logger = this.value;

    let deviceDropdown = document.getElementById('device');

    deviceDropdown.innerHTML =
        '<option value="">Select Device</option>';

    fetch(
        'get_devices.php?epc_name=' +
        encodeURIComponent(epc) +
        '&logger_id=' +
        encodeURIComponent(logger)
    )
    .then(response => response.json())
    .then(data => {

        data.forEach(device => {

            let option = document.createElement('option');

            option.value = device;
            option.text = device;

            deviceDropdown.appendChild(option);

        });

    });

});

</script>
<script>

document.getElementById('device').addEventListener('change', function() {

    let epc = document.getElementById('epc').value;
    let logger = document.getElementById('logger').value;
    let device = this.value;

    let fieldDropdown = document.getElementById('field');

    fieldDropdown.innerHTML =
        '<option value="">Select Field</option>';

    fetch(
        'get_fields.php?epc_name=' +
        encodeURIComponent(epc) +
        '&logger_id=' +
        encodeURIComponent(logger) +
        '&device=' +
        encodeURIComponent(device)
    )
    .then(response => response.json())
    .then(data => {

        data.forEach(field => {

            let option = document.createElement('option');

            option.value = field;
            option.text = field;

            fieldDropdown.appendChild(option);

        });

    });

});

</script>
<script>

document.getElementById('getValue').addEventListener('click', function() {

    let epc = document.getElementById('epc').value;
    let logger = document.getElementById('logger').value;
    let device = document.getElementById('device').value;
    let field = document.getElementById('field').value;

    fetch(
        'get_value.php?epc_name=' +
        encodeURIComponent(epc) +
        '&logger_id=' +
        encodeURIComponent(logger) +
        '&device=' +
        encodeURIComponent(device) +
        '&field=' +
        encodeURIComponent(field)
    )
    .then(response => response.json())
    .then(data => {

        document.getElementById('result').innerHTML =
            '<h3>Result</h3>' +
            '<b>Timestamp:</b> ' + data.timestamp + '<br>' +
            '<b>Value:</b> ' + data.value;

    });

});

</script>
<script>

document.getElementById('writeValue').addEventListener('click', function() {

    let epc = document.getElementById('epc').value;
    let logger = document.getElementById('logger').value;
    let device = document.getElementById('device').value;
    let field = document.getElementById('field').value;

    let timestamp = document.getElementById('correction_time').value;
    let value = document.getElementById('correction_value').value;
    let reason = document.getElementById('reason').value;

    fetch('write_value.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body:
            'epc_name=' + encodeURIComponent(epc) +
            '&logger_id=' + encodeURIComponent(logger) +
            '&device=' + encodeURIComponent(device) +
            '&field=' + encodeURIComponent(field) +
            '&timestamp=' + encodeURIComponent(timestamp) +
            '&value=' + encodeURIComponent(value) +
            '&reason=' + encodeURIComponent(reason)
    })
    .then(response => response.json())
    .then(data => {

        alert(JSON.stringify(data, null, 2));

    });

});   // <-- this was missing

</script>
</body>
</html>
